  "e300e": ["e300e", "e 300 e"]
  "e300": ["e300", "e 300"]
  "e220d": ["e220d", "e 220 d"]
  "e200": ["e200", "e 200"]
  amg_line: ["amg line", "amg-line"]
  avantgarde: ["avantgarde"]
  all_terrain: ["all-terrain", "all terrain"]
