tesla_model_3:
  # Order matters: check specific variants BEFORE generic ones
  performance: ["model 3 performance", "performance"]
  long_range: ["long range awd", "long range", "lr", "langrekkevidde"]
  standard_range: ["standard range plus", "sr+", "standard range", "sr", "rwd"]

tesla_model_y:
  # "performance" must match BEFORE "awd"/"long range"
  performance: ["model y performance", "performance"]
  long_range: ["long range awd", "long range", "lr", "langrekkevidde"]
  standard_range: ["standard range", "sr", "rwd", "bakhjulsdrift"]
  # NOTE: removed bare "awd" — too ambiguous, matches "performance awd" incorrectly

volkswagen_golf:
  # "golf r" must be checked before bare "r" patterns; "r-line" is NOT same as "R"
  gti: ["golf gti", "gti", "clubsport"]
  gte: ["gte", "plug-in hybrid", "plugin hybrid"]
  r: ["golf r 4motion", "golf r "]
  # NOTE: "golf r " (with trailing space) avoids matching "golf r-line".
  # R-Line is a trim package, not the Golf R.
  tsi: ["1.5 tsi", "1.4 tsi", "1.2 tsi", "1.0 tsi", "2.0 tsi", "tsi"]
  tdi: ["2.0 tdi", "1.6 tdi", "tdi"]
  etsi: ["e-tsi", "etsi", "mild hybrid"]
  e_golf: ["e-golf", "egolf"]

skoda_octavia:
  rs: ["octavia rs", "rs", "vrs"]
  scout: ["scout", "4x4 scout"]
  iv: ["iV", "iv", "plug-in", "phev"]
  style: ["style business", "style"]
  ambition: ["ambition"]
  elegance: ["elegance"]
  tsi: ["1.5 tsi", "1.4 tsi", "2.0 tsi", "tsi"]
  tdi: ["2.0 tdi", "1.6 tdi", "tdi"]

toyota_yaris:
  gr: ["gr sport", "gr-s", "gr yaris"]
  hybrid: ["yaris hybrid", "1.5 hybrid", "hybrid"]
  active: ["active"]
  style: ["style"]

toyota_corolla:
  touring_sports: ["touring sports", "stasjonsvogn"]
  hybrid: ["2.0 hybrid", "1.8 hybrid", "hybrid"]
  active: ["active"]
  style: ["style"]
  executive: ["executive"]

mitsubishi_outlander_phev:
  instyle: ["instyle+", "instyle pluss", "instyle"]
  intense: ["intense"]
  invite: ["invite"]
  phev: ["phev", "plug-in", "plugin hybrid"]

bmw_3serie:
  # Specific engine codes checked first (no risk of overlap)
  "330e": ["330e", "330 e"]
  "330d": ["330d", "330 d"]
  "330i": ["330i", "330 i"]
  "320d": ["320d", "320 d"]
  "320i": ["320i", "320 i"]
  "318i": ["318i", "318 i"]
  m_sport: ["m sport", "m-sport", "msport"]
  # NOTE: removed bare "xdrive" — xDrive is a spec (AWD), not a variant.
  # It's handled by spec_pricing.py as awd_drivetrain.

nissan_leaf:
  "62kwh": ["e+ 62", "62 kwh", "62kwh", "tekna 62", "e+"]
  "40kwh": ["40 kwh", "40kwh", "acenta 40", "n-connecta 40"]
  "30kwh": ["30 kwh", "30kwh", "tekna 30"]
  "24kwh": ["24 kwh", "24kwh", "visia", "acenta 24"]

mercedes_benz_eklasse:
  "e63": ["e63", "e 63", "amg 63"]
